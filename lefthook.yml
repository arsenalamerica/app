pre-commit:
  commands:
    varlock-scan:
      run: yarn varlock scan --staged
    biome:
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,json,css,scss,sass}"
      exclude: ".claude/**"
      run: yarn biome check --write {staged_files}
      stage_fixed: true
    svgo:
      glob: "src/logos/**/*.svg"
      run: yarn svgo --config svgo.config.mjs {staged_files}
      stage_fixed: true
    sort-package-json:
      glob: "package.json"
      run: npx sort-package-json
      stage_fixed: true
    knip:
      run: yarn knip
    test-related:
      glob: "*.{js,jsx,ts,tsx}"
      run: yarn vitest related --run {staged_files}

pre-push:
  commands:
    typecheck:
      run: yarn typecheck
    test:
      run: yarn test
