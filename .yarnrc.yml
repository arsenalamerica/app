defaultSemverRangePrefix: ""

logFilters:
  - code: YN0002
    level: error
  - code: YN0060
    level: error
  - code: YN0068
    level: error
  - code: YN0086
    level: error
  - level: discard
    pattern: "*react-textfit*"

nodeLinker: node-modules
nmMode: hardlinks-global

packageExtensions:
  "@napi-rs/wasm-runtime@*":
    peerDependenciesMeta:
      "@emnapi/core":
        optional: true
      "@emnapi/runtime":
        optional: true
  # Resolves YN0086. As of vercel 59.10.0, @vercel/cervel depends on
  # @vercel/backends@5.0.0, which peer-depends on @vercel/build-utils, but
  # cervel does not provide it. YN0086 is a hard error in this repo, so the
  # unmet peer fails yarn install outright, which is what made Dependabot's
  # recreate of the vercel bump PR fail with "can't resolve your JavaScript
  # dependency files". Remove once cervel declares the dependency upstream.
  "@vercel/cervel@*":
    dependencies:
      "@vercel/build-utils": "^14.7.0"
  "@axe-core/playwright@*":
    peerDependenciesMeta:
      playwright-core:
        optional: true
  "@vercel/express@*":
    peerDependencies:
      typescript: ">=4.9.5"
  vercel@*:
    peerDependencies:
      typescript: ">=4.9.5"
  "@sentry/opentelemetry@*":
    peerDependenciesMeta:
      "@opentelemetry/core":
        optional: true
      "@opentelemetry/sdk-trace-base":
        optional: true
  "@sentry/react@*":
    peerDependenciesMeta:
      react:
        optional: true
  "@sentry/webpack-plugin@*":
    peerDependenciesMeta:
      webpack:
        optional: true
  # Resolves YN0086. @next/env is aliased to @varlock/nextjs-integration (see
  # package.json resolutions), which peer-depends on varlock. Its parent is
  # next, so next is what must supply it. This is a real dependency the alias
  # creates, not misdeclared upstream metadata, so it is a `dependencies` entry
  # rather than a peerDependenciesMeta suppression.
  # Keep this range in step with the varlock version in package.json.
  next@*:
    dependencies:
      varlock: "^1.11.0"

yarnPath: .yarn/releases/yarn-4.13.0.cjs
