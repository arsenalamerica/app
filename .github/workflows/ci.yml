name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

permissions:
  contents: read

jobs:
  biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: yarn biome ci .

  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: yarn knip --reporter github-actions

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: yarn typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: yarn test

  build:
    runs-on: ubuntu-latest
    needs: [biome, knip, typecheck, test]
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'Preview' || 'Production' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      MONK_TOKEN: ${{ secrets.MONK_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - uses: brianespinosa/next-build-cache@main
      - run: yarn vercel pull --yes --token $VERCEL_TOKEN
      - run: yarn vercel build ${{ github.ref_name == github.event.repository.default_branch && '--prod' || '' }}
      - id: deploy
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            URL=$(yarn vercel deploy --prebuilt --token $VERCEL_TOKEN)
          else
            URL=$(yarn vercel deploy --prebuilt --prod --token $VERCEL_TOKEN)
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT

  e2e:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request'
    env:
      PLAYWRIGHT_BASE_URL: ${{ needs.build.outputs.url }}
      VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(jq -r '.devDependencies.playwright' package.json)" >> $GITHUB_OUTPUT
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: yarn playwright install chromium --with-deps
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: yarn playwright install-deps chromium
      - name: Run Playwright tests
        run: yarn e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  lighthouse:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request'
    env:
      VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_BYPASS_SECRET }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - path: /
            name: root
          - path: /fixtures
            name: fixtures
          - path: /table
            name: table
    steps:
      - uses: actions/checkout@v7.0.1
      - id: lighthouse
        uses: treosh/lighthouse-ci-action@12.6.2
        with:
          urls: "${{ needs.build.outputs.url }}${{ matrix.path }}"
          runs: 3
          # Reports are uploaded by the steps below instead, so the bypass
          # secret can be scrubbed out of them first.
          uploadArtifacts: false
          configPath: ./lighthouserc.js
      # Lighthouse copies its resolved settings into every report verbatim
      # (configSettings.extraHeaders), and this repository is public, so an
      # unscrubbed report would publish the bypass secret to anyone who
      # downloads the artifact.
      - name: Redact bypass secret from reports
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import pathlib

          secret = os.environ['VERCEL_BYPASS_SECRET'].encode()
          if not secret:
              raise SystemExit('VERCEL_BYPASS_SECRET is empty; refusing to upload unscrubbed reports.')

          for path in pathlib.Path('.lighthouseci').rglob('*'):
              if not path.is_file():
                  continue
              data = path.read_bytes()
              if secret in data:
                  path.write_bytes(data.replace(secret, b'[REDACTED]'))
                  print(f'redacted {path}')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: "lighthouse-${{ matrix.name }}"
          path: .lighthouseci/
          # .lighthouseci is a dotfile directory and upload-artifact skips
          # hidden paths by default, silently uploading nothing.
          include-hidden-files: true
          retention-days: 30
