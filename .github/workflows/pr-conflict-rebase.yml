name: PR conflict check & auto-rebase

# On every push that lands on main, re-check ONLY the open PRs whose base is
# that branch and either rebase them (clean, just behind), attempt a
# deterministic mergiraf resolution (real conflicts, ADR-008), or label them
# conflicting (conflicts mergiraf can't or won't resolve). Logic lives in
# .github/scripts/pr-conflict-rebase.sh.
#
# This matters most for the Dependabot queue: auto-merge lands one PR, which
# leaves every other open PR BEHIND. Without this, each is rebased by hand and
# CI burns runs on branches that are already stale before they finish.
#
# The `conflicting` label is NOT managed here — it's created once via a
# manual CLI sweep, not by this workflow. This action never touches any
# repo other than its own and never creates/verifies labels; it assumes
# `conflicting` already exists.
#
# Uses the gunnersaurus-bot App token (APP_ID/APP_PK — the same App that
# sync-fixtures.yml and sync-seasons.yml use) rather than GITHUB_TOKEN for
# every write: GITHUB_TOKEN pushes run as github-actions[bot], and GitHub's
# loop-prevention rules mean that actor's pushes do NOT trigger downstream
# on:push/on:pull_request workflow runs — so CI would never re-run against a
# rebased branch. The App is a distinct identity, so its pushes DO trigger CI.
on:
  push:
    branches: [main]

# contents:read only — actions/checkout needs it to pull these scripts onto
# the runner. Every gh/API/git write below uses the App token, never
# GITHUB_TOKEN.
permissions:
  contents: read

# cancel-in-progress: a rebase/label decision is only meaningful against the
# latest branch tip. Without this, a burst of pushes queues stale runs that
# act on merge state GitHub already recomputed away — cancelling is safe:
# every remote write (the API rebase call, the mergiraf-path git push, each
# label edit) is individually atomic. At worst a cancellation lands between
# a push and its label removal, leaving a stale `conflicting` label on a
# resolved PR — which the next run's clean-state pass removes.
concurrency:
  group: pr-conflict-rebase-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  check-and-fix:
    name: Check PRs targeting ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # Full history: the mergiraf path runs real `git merge`s of base
          # into PR heads, which need actual merge bases, not a depth-1 tip.
          fetch-depth: 0

      - name: Generate gunnersaurus-bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PK }}

      # Pinned mergiraf release for structural conflict resolution (ADR-008).
      # Static musl build; the tarball contains the bare `mergiraf` binary.
      # Bump manually — Dependabot's github-actions ecosystem does not see a
      # raw Codeberg curl, so nothing will open a PR for this. Update the SHA
      # alongside the version, and check the release notes for merge-driver
      # flag changes against the driver line in pr-conflict-rebase.sh.
      #
      # continue-on-error is deliberate. Auto-resolution is an ENHANCEMENT on
      # top of the rebase/label automation, which predates it and needs no
      # binary at all. Letting a third-party host outage fail this step hard
      # would take the whole Dependabot queue-clearing job offline — nothing
      # rebased, nothing labeled — over a feature that is merely unavailable.
      # The script detects a missing binary and degrades to label-only.
      - name: Install mergiraf
        id: mergiraf
        continue-on-error: true
        env:
          MERGIRAF_VERSION: v0.18.0
          MERGIRAF_SHA256: fcc1688a8ad073c132c90847321786f79ef7e23aed8d104c25edd122c38457e7
        run: |
          curl -sSfL --retry 3 --retry-delay 2 --max-time 120 \
            "https://codeberg.org/mergiraf/mergiraf/releases/download/${MERGIRAF_VERSION}/mergiraf_x86_64-unknown-linux-musl.tar.gz" \
            -o "$RUNNER_TEMP/mergiraf.tar.gz"
          echo "${MERGIRAF_SHA256}  $RUNNER_TEMP/mergiraf.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/mergiraf.tar.gz" -C "$RUNNER_TEMP/bin" mergiraf
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Note degraded mode
        if: steps.mergiraf.outcome == 'failure'
        run: echo "::warning::mergiraf unavailable — running label-only; the rebase/label automation is unaffected."

      - name: Check PR conflicts / rebase behind PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: .github/scripts/pr-conflict-rebase.sh "${{ github.ref_name }}"
